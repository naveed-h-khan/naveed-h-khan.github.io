  <script src="/assets/js/site.js?v=20260925-1"></script>
  <script>
    (async function () {
      const file = new URLSearchParams(window.location.search).get("file");
      const state = document.getElementById("post-state");
      const content = document.getElementById("post-content");
      const normalizeText = (value) => {
        const replacements = [["\u00C2\u00B7", "·"], ["\u00C2\u00A9", "©"], ["\u00E2\u20AC\u2122", "'"], ["\u00E2\u20AC\u0153", "\""], ["\u00E2\u20AC\u009D", "\""], ["\u00E2\u20AC\u201C", "–"], ["\u00E2\u20AC\u201D", "—"], ["\u00E2\u20AC\u00A6", "..."]];
        return replacements.reduce((text, pair) => text.split(pair[0]).join(pair[1]), value);
      };
      if (!file || !/^[\w-]+\.html$/.test(file)) { state.textContent = "No post specified."; return; }
      try {
        const response = await fetch(`posts/${file}`);
        if (!response.ok) throw new Error(String(response.status));
        const html = normalizeText(await response.text());
        const documentFragment = new DOMParser().parseFromString(html, "text/html");
        const article = documentFragment.querySelector("article");
        const title = documentFragment.querySelector("h1");
        const meta = documentFragment.querySelector(".text-muted");
        if (title) {
          const cleanTitle = normalizeText(title.textContent).trim();
          document.title = `${cleanTitle} | Naveed H Khan`;
          const heading = document.createElement("h1"); heading.className = "post-title"; heading.textContent = cleanTitle; content.appendChild(heading);
        }
        if (meta) state.textContent = normalizeText(meta.textContent).replace(/\s+/g, " ").trim(); else state.remove();
        if (article) { article.querySelector("h1")?.remove(); article.querySelector(".text-muted")?.remove(); }
        content.insertAdjacentHTML("beforeend", article ? article.innerHTML : html);
      } catch (error) {
        state.textContent = "Failed to load post.";
        content.innerHTML = "<p>The requested article could not be loaded.</p>";
      }
    })();
  </script>
</body>
