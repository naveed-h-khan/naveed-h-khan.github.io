<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <title>Blog Post | Naveed Khan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20260405-5">
</head>
<body class="page-shell page-post page-reading">
  <div class="container-lg main-container">
    <div id="site-header"></div>

    <main class="post-shell fade-in fade-delay-1">
      <div id="post-state" class="article-meta mb-3">Loading article...</div>
      <article id="post-content" class="post-content"></article>
    </main>

    <div id="site-footer"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/assets/js/site.js?v=20260405-5"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const file = params.get("file");
      const state = document.getElementById("post-state");
      const content = document.getElementById("post-content");

      const normalizeText = (value) => {
        const replacements = [
          ["\u00C2\u00B7", "·"],
          ["\u00C2\u00A9", "©"],
          ["\u00E2\u20AC\u2122", "'"],
          ["\u00E2\u20AC\u0153", "\""],
          ["\u00E2\u20AC\u009D", "\""],
          ["\u00E2\u20AC\u201C", "–"],
          ["\u00E2\u20AC\u201D", "—"],
          ["\u00E2\u20AC\u00A6", "..."]
        ];

        return replacements.reduce((text, [from, to]) => text.split(from).join(to), value);
      };

      if (!file || !/^[\w-]+\.html$/.test(file)) {
        state.textContent = "No post specified.";
        return;
      }

      try {
        const res = await fetch(`posts/${file}`);
        if (!res.ok) {
          throw new Error(String(res.status));
        }

        const parser = new DOMParser();
        const html = normalizeText(await res.text());
        const doc = parser.parseFromString(html, "text/html");
        const article = doc.querySelector("article");
        const title = doc.querySelector("h1");
        const meta = doc.querySelector(".text-muted");

        if (title) {
          const cleanTitle = normalizeText(title.textContent).trim();
          document.title = `${cleanTitle} | Naveed Khan`;
          content.insertAdjacentHTML("beforeend", `<h1 class="post-title">${cleanTitle}</h1>`);
        }

        if (meta) {
          state.textContent = normalizeText(meta.textContent).replace(/\s+/g, " ").trim();
        } else {
          state.remove();
        }

        if (article) {
          const articleTitle = article.querySelector("h1");
          const articleMeta = article.querySelector(".text-muted");

          if (articleTitle) {
            articleTitle.remove();
          }

          if (articleMeta) {
            articleMeta.remove();
          }
        }

        content.insertAdjacentHTML("beforeend", article ? article.innerHTML : html);
      } catch (error) {
        state.textContent = "Failed to load post.";
        content.innerHTML = "<p class='text-danger mb-0'>The requested article could not be loaded.</p>";
      }
    })();
  </script>
</body>
</html>
